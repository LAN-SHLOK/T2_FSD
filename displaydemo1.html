<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gc {
            background-color:rgba(0, 128, 128, 1);
            border: 2px solid rgb(142, 145, 141);
            border-radius: 5px;
            display: grid;
            grid-template-rows: repeat(3,1fr);
            grid-template-columns: repeat(3,1fr);
            justify-content:center;
            height: 500px;
            grid-gap:10px 10px;

         }

        .gbox {
            background-color:rgba(255, 215, 0,1);
            border: 2px solid rgba(0, 128, 128, 1);
            padding: 10px;
            font-size: 30px;
            color:rgba(255, 0, 255, 1);
            text-align: center;
            border-radius: 10px;
        }
        #g1{
            grid-row: 1/3;
        }
        #g2{
            grid-row: 1/3;
        }
        #g3{
            grid-row: 1/3;
        }
        #g4{
            grid-column:1/4;
        }
        #g5{
            grid-column:1/2;
        }
        #g9{
            grid-column: 3/4;
        }

    </style>
</head>

<body>
    <div class="gc">
        <div class="gbox" id="g1">g-1</div>
        <div class="gbox" id="g2">g-2</div>
        <div class="gbox" id="g3">g-3</div>
        <div class="gbox" id="g4">g-4</div>
        <div class="gbox" id="g5">g-5</div>
        <div class="gbox" id="g6">g-6</div>
        <div class="gbox" id="g7">g-7</div>
        <div class="gbox" id="g8">g-8</div>
        <div class="gbox" id="g9">g-9</div>
    </div>
</body>

</html>
