<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            border: 2px solid green;
            padding: 5px;
            margin: 20px;
            height: 1000px;
            width: 600px;
            display: none;
            /*Inline element doesnt give top margin*/
        }
        .b:hover>.a{
            display:flex;
            background-image: url(diddy.png);
            background-size: cover;
        }
        .fc{
            background-color: pink;
            border:2px solid black;
            display: flex;
            flex-direction: row;
            align-items:center;
            gap:10px;
            flex-wrap: wrap;
            width: 200px;
        }
        .box{
            background-color: aqua;
            border:2px solid red;
            padding: 10px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="b">Dhappa
        <div class="a">Hellodiv</div>
        <span class="a">Hellospan</span>
    </div>
    <div class="fc">
        <div class="box" id="b1">box 1</div>
        <div class="box" id="b2">box 2</div>
        <div class="box" id="b3">box 3</div>
        <div class="box" id="b4">box 4</div>
        <div class="box" id="b5">box 5</div>
        <div class="box" id="b1">box 1</div>
        <div class="box" id="b2">box 2</div>
        <div class="box" id="b3">box 3</div>
        <div class="box" id="b4">box 4</div>
        <div class="box" id="b5">box 5</div><div class="box" id="b1">box 1</div>
        <div class="box" id="b2">box 2</div>
        <div class="box" id="b3">box 3</div>
        <div class="box" id="b4">box 4</div>
    </div>
</body>

</html>
