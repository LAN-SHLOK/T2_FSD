<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            height:30px;
            width: 30px;
            border-radius: 50%;
        }
        a:hover{
            text-decoration: none;
            color:black;
            font-size: 22px;
            font-weight: 800px;
        }
        #d{
            display: flex;
            gap:20px;
            background-image: linear-gradient();
            border:2px solid beige;
            justify-content: center;
            align-items: center;
        }
        @media (max-width:600px) {
            #d{
                flex-direction: column;
            }
            
        }
    </style>
</head>
<body>
    <div id="d">
        <img src="image.png">
        <a href="#">
            Home
        </a>
        <a href="##">About us</a>
        <a href="###">Contact us</a>
    </div>
</body>
</html>
