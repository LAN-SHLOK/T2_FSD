<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        div {
            transition-property: height,width;
            transition-duration: 5s;
            transition-delay: 1s;
            height: 200px;
            width: 200px;
            border: 2px solid purple;
            background-color: aqua;
            transition: 1s all;
             display: flex;
             flex-direction: column;
            align-items:center;
            justify-content: center;
            color: red;
            border-radius:10px ;
            transition-timing-function: ease-in;
        }

        div:hover {
            box-shadow: 16px 8px 16px rgb(86, 89, 90);
            background-color: black;
            height: 400px;
            width: 400px;
            border: 2px solid rgb(243, 157, 243);
            background-image: url(diddy.png);
            background-size: 400px 400px;
            position: relative;
            color: rgb(255, 60, 0);
            left: 50px;
        }
    </style>
</head>

<body>
    <div>
        <h2>Diddy tera devar diwana</h2>
        <h1>For Sale</h1>
        <h3>Mai ajau kya ghar pe</h3>
    </div>
</body>

</html>
